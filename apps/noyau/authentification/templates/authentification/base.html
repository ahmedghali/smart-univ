{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{% static 'images/smart-univ-logo.svg' %}">
    <title>{% block title %}Smart-Univ{% endblock %}</title>

    <!-- Bootstrap 5 RTL CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts - Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        html { font-size: 104%; } /* taille du texte de tout le site */
        :root {
            --primary-color: #344D59;
            --primary-dark: #37463D;
            --secondary-color: #5B696B;
            --accent-color: #C5C5A9;
            --dark-color: #000000;
            --neutral-color: #535953;
            --light-color: #F8FBF1;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #344d59 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0;
            padding: 20px 10px;
        }

        .auth-bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .auth-container-wide {
            max-width: 880px;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #344d59 0%, #000000 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .auth-header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .auth-header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .auth-body {
            padding: 40px 30px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(52, 77, 89, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #344d59 0%, #000000 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 77, 89, 0.4);
        }

        .alert-auth-danger, .alert-danger, .alert-error {
            background-color: #fee2e2 !important;
            border: 2px solid #ef4444 !important;
            color: #b91c1c !important;
            font-weight: 700 !important;
            font-size: 0.95rem;
            border-radius: 10px;
            padding: 14px 18px;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.15);
            margin-bottom: 20px;
        }

        .alert-auth-danger .error-text-highlight {
            color: #b91c1c !important;
            font-weight: 700 !important;
        }

        .role-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .role-card:hover {
            border-color: var(--primary-color);
            background: var(--light-color);
            transform: translateX(-5px);
        }

        .role-card.selected {
            border-color: var(--primary-color);
            background: var(--light-color);
        }

        .role-card input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .role-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-right: 10px;
        }

        .alert {
            border-radius: 8px;
            border: none;
        }

        .logo {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            border-radius: 22px;
            box-shadow: 0 10px 28px rgba(255, 215, 0, 0.35);
        }

        .logo img {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-bg-pattern"></div>
    <div class="{% block container_class %}auth-container{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
