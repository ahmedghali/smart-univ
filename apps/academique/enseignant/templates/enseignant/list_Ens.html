{% extends 'enseignant/base_Ens.html' %}

{% block content_ens %}
<div class="container-fluid py-4">
    <h2>{{ title }}</h2>
    <div class="card p-3 mt-3 shadow-sm">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>المعرف / Matricule</th>
                    <th>الاسم واللقب / Nom & Prénom</th>
                </tr>
            </thead>
            <tbody>
                {% for ens in enseignants %}
                <tr>
                    <td>{{ ens.matricule }}</td>
                    <td><a href="{% url 'ense:detail_Ens' ens.id %}">{{ ens.get_nom_complet }}</a></td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center text-muted">لا يوجد أساتذة / Aucun enseignant</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
